<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 220px; font-family: Arial, sans-serif; padding: 10px; margin: 0; }
    h3 { margin-top: 0; color: #333; }
    .status { background: #f3f3f3; padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 13px; }
    label { font-size: 12px; font-weight: bold; display: block; margin-bottom: 3px; }
    input { width: 90%; padding: 5px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { width: 100%; padding: 6px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h3>Controlador de Tempo</h3>
  <div class="status">
    <div><strong>Site:</strong> <span id="txtSite">...</span></div>
    <div><strong>Tempo Gasto:</strong> <span id="txtTempo">0 min</span></div>
  </div>
  
  <label>Mudar Site (ex: instagram.com):</label>
  <input type="text" id="inputSite" placeholder="youtube.com">
  
  <label>Mudar Limite (em minutos):</label>
  <input type="number" id="inputLimite" placeholder="120">
  
  <button id="btnSalvar">Salvar Configurações</button>

  <script src="popup.js"></script>
</body>
</html>
